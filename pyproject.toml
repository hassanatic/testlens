[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testlens"
version = "0.1.0"
description = "Test result history from JUnit XML (pytest, Robot Framework): flaky tests, first failing commit, failure clusters, slow tests and a CI gate that blocks only on new failures"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=7", "robotframework>=7"]

[project.scripts]
testlens = "testlens.cli:main"

[tool.setuptools]
packages = ["testlens", "sut"]

[tool.pytest.ini_options]
testpaths = ["tests", "sut"]
