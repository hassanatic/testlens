name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - run: pytest -q
      - name: system under test, pytest and Robot Framework, gated by testlens
        run: |
          mkdir -p out
          pytest -q sut --junitxml=out/pytest.xml
          PYTHONPATH=. robot --outputdir out --xunit robot.xml robot/framing.robot
          testlens --db out/history.db ingest out/pytest.xml out/robot.xml --run "$GITHUB_RUN_ID" --commit "$GITHUB_SHA" --seq "$GITHUB_RUN_NUMBER"
          testlens --db out/history.db gate --commit "$GITHUB_SHA"
